<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hobby Graveyard · RSVP Ledger</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#f7f0dd; --card:#fdf8ec; --ink:#3a3126;
    --red:#8e2f35; --blue:#2b4372; --gold:#a97c28; --gold-soft:#c9a45c; --green:#4d6b48;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--parchment);
    color:var(--ink);
    font-family:'Cormorant Garamond', Georgia, serif;
    font-size:18px; line-height:1.5;
    padding:24px 14px 70px;
  }
  .page{max-width:820px;margin:0 auto}
  h1{
    font-family:'Cinzel',serif; font-weight:600; text-align:center;
    color:var(--red); font-size:28px; letter-spacing:.06em;
  }
  .sub{text-align:center;font-style:italic;margin-bottom:26px}

  .stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:26px}
  .stat{
    flex:1 1 150px; text-align:center;
    background:var(--card); border:1px solid var(--gold-soft); padding:18px 10px;
  }
  .stat .num{font-family:'Cinzel',serif;font-size:34px;font-weight:700;color:var(--blue)}
  .stat.head .num{color:var(--green)}
  .stat.no .num{color:var(--red)}
  .stat .lbl{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-top:4px}

  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .toolbar .updated{font-style:italic;font-size:16px;color:#6f6350}
  button.refresh{
    cursor:pointer; font-family:'Cinzel',serif; font-weight:600; font-size:14px;
    letter-spacing:.1em; color:#fdf8ec; background:var(--blue);
    border:none; padding:10px 20px;
  }
  button.refresh:hover{background:#22365c}
  button.refresh:focus-visible{outline:2px solid var(--red);outline-offset:3px}

  .entry{
    background:var(--card); border:1px solid var(--gold-soft);
    border-left:5px solid var(--green);
    padding:16px 18px; margin-bottom:12px;
  }
  .entry.no{border-left-color:var(--red)}
  .entry .row1{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
  .entry .name{font-family:'Cinzel',serif;font-weight:600;font-size:18px}
  .entry .status{font-style:italic;color:var(--green)}
  .entry.no .status{color:var(--red)}
  .entry .meta{font-size:17px;margin-top:4px}
  .entry .meta a{color:var(--blue)}
  .entry .guests{margin-top:4px}
  .entry .guests strong{color:var(--blue)}
  .entry .note{margin-top:6px;font-style:italic;border-top:1px dashed var(--gold-soft);padding-top:6px}
  .entry .time{font-size:15px;color:#6f6350;margin-top:6px}

  .empty, .err{
    text-align:center; background:var(--card); border:1px solid var(--gold-soft);
    padding:40px 20px; font-style:italic;
  }
  .err{color:var(--red);display:none}
</style>
</head>
<body>
<div class="page">
  <h1>The RSVP Ledger</h1>
  <p class="sub">Hobby Graveyard: A Birthday Renaissance &middot; August 22, 2026</p>

  <div class="stats">
    <div class="stat"><div class="num" id="statParties">–</div><div class="lbl">Parties (Yes)</div></div>
    <div class="stat head"><div class="num" id="statHeads">–</div><div class="lbl">Total Attending</div></div>
    <div class="stat no"><div class="num" id="statNo">–</div><div class="lbl">Regrets</div></div>
  </div>

  <div class="toolbar">
    <span class="updated" id="updated">Loading replies&hellip;</span>
    <button class="refresh" id="refreshBtn">Refresh</button>
  </div>

  <div id="list"></div>
  <p class="err" id="errBox">Could not load replies. Check that the Script URL is set below and the Apps Script is deployed with access set to "Anyone".</p>
</div>

<script>
// ============================================================
// PASTE THE SAME GOOGLE APPS SCRIPT WEB APP URL HERE
// ============================================================
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyvy72kcn9eNTJUn_pXqbqqtWHGcu9ZaswN34o4dTUVdZ1Rk0vjmloAAlCt2SitucPQ/exec";

const list = document.getElementById('list');
const errBox = document.getElementById('errBox');

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function load(){
  errBox.style.display = 'none';
  document.getElementById('updated').textContent = 'Loading replies\u2026';
  try{
    if (SCRIPT_URL.indexOf('http') !== 0) throw new Error('no url');
    const res = await fetch(SCRIPT_URL + '?t=' + Date.now());
    if(!res.ok) throw new Error('bad response');
    const data = await res.json();
    render(data);
  }catch(e){
    errBox.style.display = 'block';
    document.getElementById('updated').textContent = '';
  }
}

function render(rows){
  rows.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
  const yes = rows.filter(r => String(r.attending).toLowerCase().includes('yes'));
  const no = rows.filter(r => !String(r.attending).toLowerCase().includes('yes'));
  const heads = yes.reduce((sum,r) => sum + 1 + (parseInt(r.guestCount,10) || 0), 0);

  document.getElementById('statParties').textContent = yes.length;
  document.getElementById('statHeads').textContent = heads;
  document.getElementById('statNo').textContent = no.length;
  document.getElementById('updated').textContent = 'Updated ' + new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});

  if(!rows.length){
    list.innerHTML = '<p class="empty">No replies yet. The ledger awaits its first inscription.</p>';
    return;
  }

  list.innerHTML = rows.map(r => {
    const isYes = String(r.attending).toLowerCase().includes('yes');
    const when = r.timestamp ? new Date(r.timestamp).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : '';
    const phoneDigits = String(r.phone ?? '').replace(/[^\d+]/g,'');
    return '<div class="entry ' + (isYes ? '' : 'no') + '">' +
      '<div class="row1"><span class="name">' + esc(r.name) + '</span>' +
      '<span class="status">' + (isYes ? 'Joyfully, yes' : 'Alas, cannot') + '</span></div>' +
      '<div class="meta">📞 <a href="tel:' + esc(phoneDigits) + '">' + esc(r.phone) + '</a></div>' +
      (isYes && r.guestNames
        ? '<div class="guests"><strong>Bringing:</strong> ' + esc(r.guestNames) + ' <span style="color:#6f6350">(party of ' + (1 + (parseInt(r.guestCount,10)||0)) + ')</span></div>'
        : (isYes ? '<div class="guests" style="color:#6f6350">Party of 1</div>' : '')) +
      (r.note ? '<div class="note">&ldquo;' + esc(r.note) + '&rdquo;</div>' : '') +
      (when ? '<div class="time">Replied ' + when + '</div>' : '') +
    '</div>';
  }).join('');
}

document.getElementById('refreshBtn').addEventListener('click', load);
load();
setInterval(load, 60000);
</script>
</body>
</html>
